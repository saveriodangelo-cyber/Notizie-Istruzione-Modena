name: Controlla notizie in evidenza

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-news:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Controlla nuove notizie
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_news_once.py

      - name: Salva archivio notizie viste
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add seen_news.json
          git diff --cached --quiet || git commit -m "Aggiorna notizie viste"
          git push
