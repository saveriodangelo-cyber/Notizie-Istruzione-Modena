name: Probe endpoint circolari Convitto

on:
  push:
    paths:
      - "probe_convitto_endpoints.py"
      - ".github/workflows/probe-convitto-endpoints.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python probe_convitto_endpoints.py
