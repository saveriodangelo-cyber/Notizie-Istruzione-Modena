name: Controlla notizie in evidenza

on:
  workflow_dispatch:
  schedule:
    # Ogni 30 minuti. GitHub usa l'orario UTC.
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: telegram-notizie-istruzione
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Controlla notizie e invia Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_ON_FIRST_RUN: "false"
        run: python check_news_once.py

      - name: Salva storico notizie
        run: |
          if git diff --quiet seen_news.json; then
            echo "Nessuna modifica allo storico."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_news.json
            git commit -m "Aggiorna storico notizie"
            git push
          fi
